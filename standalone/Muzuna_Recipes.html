<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مزيونة | كتيب الوصفات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<style>
:root{--a:#c48bd9;--ink:#2b2233;--muted:#6f6478}
:root{--a2:color-mix(in srgb,var(--a) 22%,#fff);--a3:color-mix(in srgb,var(--a) 9%,#fff);--ad:color-mix(in srgb,var(--a) 70%,#000)}
*{box-sizing:border-box}
body{margin:0;background:#ebe7ee;color:var(--ink);font:14px/1.6 Tajawal,Tahoma,Arial,sans-serif}
.panel{position:sticky;top:0;z-index:9;background:#fff;border-bottom:3px solid var(--a);box-shadow:0 4px 18px #0001;padding:12px 18px}
.panel h2{margin:0 0 6px;font-size:17px;color:var(--ad)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel input[type=text]{font:inherit;font-size:15px;padding:7px 9px;border:1.5px solid #ddd;border-radius:8px;min-width:220px}
.btn{font:inherit;font-weight:700;font-size:14px;padding:9px 16px;border-radius:9px;border:0;cursor:pointer;background:var(--a);color:#fff}
.btn.ghost{background:var(--a3);color:var(--ad);border:1.5px solid var(--a2)}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px #ccc;cursor:pointer}
.hint{font-size:12px;color:var(--muted)}
.pages{padding:24px 0 60px;display:flex;flex-direction:column;align-items:center;gap:22px}
.page{width:210mm;height:297mm;background:#fff;position:relative;overflow:hidden;box-shadow:0 6px 24px #0002}
.foot{position:absolute;bottom:7mm;left:0;right:0;text-align:center;line-height:1.15}
.foot .brand{font-family:'Aref Ruqaa',serif;font-size:22px;color:var(--a)}
.foot .h{font-size:10.5px;color:var(--muted)}
/* cover and dividers */
.solid{background:var(--a);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.frame{position:absolute;inset:14mm;border:1.5px solid #ffffff88}
.circ{width:62mm;height:62mm;border-radius:50%;border:2px solid #ffffffaa;display:grid;place-items:center;font-family:'Aref Ruqaa',serif;font-size:44px;box-shadow:0 0 0 8mm #ffffff12;margin-bottom:18mm;position:relative}
.solid h1{font-family:'Aref Ruqaa',serif;font-size:50px;margin:0;line-height:1.2;position:relative}
.solid .en{font-size:22px;font-weight:700;letter-spacing:1px;opacity:.95;position:relative}
.solid .sub{font-size:16px;margin-top:8px;opacity:.95;position:relative;max-width:140mm}
.solid .foot .brand,.solid .foot .h{color:#fff}
/* tips */
.in{padding:16mm 15mm 26mm}
.ttl{font-family:'Aref Ruqaa',serif;color:var(--a);font-size:44px;text-align:center;margin:0 0 4px;line-height:1.3}
.lead{text-align:center;color:var(--muted);font-size:17px;margin:0 0 14px}
.tips{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}
.tip{border:2px solid var(--a2);border-radius:14px;padding:18px 16px;min-height:50mm;display:flex;gap:12px;align-items:flex-start;background:#fff}
.tip .i{flex:none;width:64px;height:64px;border-radius:50%;background:var(--a3);display:grid;place-items:center;font-size:33px;border:2px solid var(--a2)}
.tip b{display:block;color:var(--ad);font-size:18px;margin-bottom:2px}
.tip p{margin:0;font-size:15.5px;line-height:1.75}
table{width:100%;border-collapse:collapse;font-size:16.5px;margin-top:10px}
th{background:var(--a);color:#fff;padding:9px 8px;font-weight:700}
td{border:1.5px solid var(--a2);padding:13px 12px;text-align:center}
td:first-child{text-align:right;font-weight:700}
.box{margin-top:18px;background:var(--a3);border:2px dashed var(--a);border-radius:14px;padding:16px 18px;font-size:16px}
/* recipe */
.hero{height:128mm;display:grid;grid-template-columns:1fr 1fr;gap:2mm}
.ph{position:relative;overflow:hidden;cursor:pointer;background:linear-gradient(135deg,var(--a2),var(--a3) 60%,#fff);display:grid;place-items:center}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .e{font-size:84px;filter:drop-shadow(0 8px 10px #0002)}
.ph .add{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:#fffd;color:var(--ad);font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;white-space:nowrap}
.ph:hover .add{background:var(--a);color:#fff}
.ph .x{position:absolute;top:8px;left:8px;width:28px;height:28px;border-radius:50%;background:#000a;color:#fff;border:0;font-size:16px;cursor:pointer;display:none}
.ph.has .x{display:block}.ph.has .add{display:none}
.tcard{position:relative;margin:-17mm 10mm 0;background:#fff;box-shadow:0 8px 22px #0002;padding:7mm 8mm 5mm;text-align:center}
.tcard h2{font-family:'Aref Ruqaa',serif;color:var(--a);font-size:38px;margin:0;line-height:1.3}
.tag{display:inline-block;background:var(--a2);color:var(--ad);font-weight:700;font-size:12px;padding:3px 12px;border-radius:20px;margin-top:4px}
.rb{display:grid;grid-template-columns:1fr 64mm;gap:10mm;margin:9mm 14mm 0}
.rb h3{margin:0 0 8px;font-size:20px;text-align:center;border-bottom:2px solid var(--a2);padding-bottom:5px}
.rb ol{margin:0;padding-right:20px;font-size:15.5px;line-height:1.95;font-weight:500}
.rb ul{margin:0;padding-right:18px;font-size:15px;line-height:1.95;font-weight:700}
.rb li::marker{color:var(--a);font-weight:800}
.nt{margin:5mm 14mm 0;border-top:1.5px solid var(--a2);padding-top:8px;font-size:14.5px;font-weight:700}
.nt span{color:var(--a)}
.why{margin:8mm 14mm 0;background:var(--a3);border-radius:10px;padding:10px 14px;font-size:14.5px}
.why b{color:var(--ad)}
.edit .page{outline:2px dashed #0002}
@media (max-width:860px){.pages{zoom:.5}}
@page{size:A4;margin:0}
@media print{body{background:#fff}.panel{display:none}.pages{padding:0;gap:0;zoom:1}.page{box-shadow:none;break-after:page}.ph .add,.ph .x{display:none!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<div class="panel">
 <h2>كتيب وصفات مزيونة لزيادة الوزن</h2>
 <div class="row">
  <input type="text" id="hd" value="مزيونة | خلطة الأنوثة" title="نص التذييل">
  <span class="hint">لون التصميم:</span>
  <span class="sw" style="background:#c48bd9" data-c="#c48bd9"></span>
  <span class="sw" style="background:#d98ca3" data-c="#d98ca3"></span>
  <span class="sw" style="background:#b98a6e" data-c="#b98a6e"></span>
  <span class="sw" style="background:#7fa9a0" data-c="#7fa9a0"></span>
  <input type="color" id="col" value="#c48bd9" style="width:40px;height:32px;padding:0;border:0">
  <button class="btn" id="print">طباعة / حفظ PDF</button>
  <button class="btn ghost" id="editBtn">تعديل النصوص: مغلق</button>
 </div>
 <div class="hint" style="margin-top:6px">اضغطي على أي مكان صورة في أعلى الوصفة لإضافة صورة من جهازك. الصور تحفظ في هذا المتصفح. الأماكن الفارغة تطبع بتصميم ملون مع أيقونة.</div>
 <input type="file" id="file" accept="image/*" hidden>
</div>
<div class="pages" id="pages"></div>

/* photos stored in IndexedDB */
let db=null;
const open=indexedDB.open("muzuna_recipes",1);
open.onupgradeneeded=()=>open.result.createObjectStore("ph");
open.onsuccess=()=>{db=open.result;const tx=db.transaction("ph").objectStore("ph").openCursor();tx.onsuccess=e=>{const c=e.target.result;if(c){show(c.key,c.value);c.continue()}}};
function show(k,src){const el=document.querySelector(`.ph[data-k="${k}"]`);if(!el)return;let im=el.querySelector("img");if(!src){if(im)im.remove();el.classList.remove("has");return}if(!im){im=document.createElement("img");el.prepend(im)}im.src=src;el.classList.add("has")}
function save(k,v){try{const s=db.transaction("ph","readwrite").objectStore("ph");v?s.put(v,k):s.delete(k)}catch(e){}}
let cur=null;
$("pages").addEventListener("click",e=>{const ph=e.target.closest(".ph");if(!ph||ed)return;
 if(e.target.classList.contains("x")){show(ph.dataset.k,null);save(ph.dataset.k,null);return}
 cur=ph.dataset.k;$("file").value="";$("file").click()});
$("file").addEventListener("change",()=>{const f=$("file").files[0];if(!f||!cur)return;const img=new Image();img.onload=()=>{const m=1400,sc=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=img.width*sc;c.height=img.height*sc;c.getContext("2d").drawImage(img,0,0,c.width,c.height);const d=c.toDataURL("image/jpeg",.85);show(cur,d);save(cur,d);URL.revokeObjectURL(img.src)};img.src=URL.createObjectURL(f)});

try{const h=localStorage.getItem("mzr_hd");if(h)$("hd").value=h;const c=localStorage.getItem("mz_col");if(c)setCol(c)}catch(e){}
