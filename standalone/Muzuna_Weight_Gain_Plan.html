<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مزيونة | برنامج زيادة الوزن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<style>
:root{--a:#c48bd9;--ink:#2b2233;--muted:#6f6478}
:root{--a2:color-mix(in srgb,var(--a) 22%,#fff);--a3:color-mix(in srgb,var(--a) 9%,#fff);--ad:color-mix(in srgb,var(--a) 70%,#000)}
*{box-sizing:border-box}
body{margin:0;background:#ebe7ee;color:var(--ink);font:14px/1.6 Tajawal,Tahoma,Arial,sans-serif}
/* control panel */
.panel{position:sticky;top:0;z-index:9;background:#fff;border-bottom:3px solid var(--a);box-shadow:0 4px 18px #0001;padding:12px 18px}
.panel h2{margin:0 0 8px;font-size:17px;color:var(--ad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 12px;align-items:end}
.panel label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}
.panel input,.panel select{font:inherit;font-size:15px;padding:7px 9px;border:1.5px solid #ddd;border-radius:8px;background:#fff}
.panel input:focus,.panel select:focus{outline:2px solid var(--a);border-color:var(--a)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.btn{font:inherit;font-weight:700;font-size:14px;padding:9px 16px;border-radius:9px;border:0;cursor:pointer;background:var(--a);color:#fff}
.btn.ghost{background:var(--a3);color:var(--ad);border:1.5px solid var(--a2)}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px #ccc;cursor:pointer}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.stat{background:var(--a3);border:1px solid var(--a2);border-radius:8px;padding:4px 10px;font-size:13px}
.stat b{color:var(--ad)}
.warn{background:#fff3e6;border:1px solid #f3c48d;color:#8a4b00;border-radius:8px;padding:6px 10px;font-size:13px;margin-top:8px;display:none}
.hint{font-size:12px;color:var(--muted)}
/* pages */
.pages{padding:24px 0 60px;display:flex;flex-direction:column;align-items:center;gap:22px}
.page{width:210mm;height:297mm;background:#fff;position:relative;overflow:hidden;box-shadow:0 6px 24px #0002;padding:16mm 14mm 24mm;display:flex;flex-direction:column}
.pno{position:absolute;top:0;right:12mm;background:var(--a2);color:#fff;font-weight:800;font-size:18px;width:30px;height:38px;border-radius:0 0 10px 10px;display:grid;place-items:center;color:var(--ad)}
.foot{position:absolute;bottom:9mm;left:0;right:0;text-align:center;line-height:1.2}
.foot .brand{font-family:'Aref Ruqaa',serif;font-size:24px;color:var(--ad)}
.foot .h{font-size:11px;color:var(--muted)}
.bar{background:var(--a);color:#fff;text-align:center;font-weight:800;font-size:17px;padding:9px 14px;border-radius:4px;line-height:1.45;margin:6px 0 10px}
.bar small{display:block;font-weight:500;font-size:13px;opacity:.95}
.sub{text-align:center;font-weight:700;font-size:14px;margin:4px 0 12px}
.note{font-size:12px;color:var(--muted);line-height:1.6}
.acc{color:var(--a);font-weight:700}
.q{unicode-bidi:isolate;font-weight:800;color:var(--ad);border-bottom:1.5px dotted var(--a);padding:0 1px;outline:none;white-space:nowrap}
.q.m{background:#fff6c9}
ul.dots{margin:4px 0;padding-right:18px}ul.dots li{margin:2px 0}
/* breakfast cards */
.cards{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--a);flex:1;max-height:200mm}
.card{border:1.5px solid var(--a2);padding:12px 12px 10px;position:relative;display:flex;flex-direction:column}
.ico{font-size:50px;text-align:center;line-height:1.1;margin-bottom:8px;filter:drop-shadow(0 3px 3px #0002)}
.chk{display:flex;gap:6px;font-weight:700;font-size:14.5px;line-height:1.8}
.chk::before{content:"✔";color:var(--a);font-size:15px}
.card .note{margin-top:8px}
.tag{position:absolute;top:8px;left:8px;background:var(--a2);color:var(--ad);font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px}
/* tables */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--a);color:#fff;font-weight:700;padding:8px 6px}
td{border:1.5px solid var(--a2);padding:7px 8px;text-align:center;vertical-align:middle}
.wk td:nth-child(3){text-align:center;font-weight:700}
.wk tr.l td{background:#faf8fb}
.wk .mn{color:var(--a);font-weight:700}
.wk{border:2px solid var(--a)}.wk td{padding:13px 10px;font-size:13.5px;line-height:1.7}
/* icon tiles */
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 8px;margin:8px 0 12px}
.tile{text-align:center;font-size:12px;font-weight:700;line-height:1.45}
.tile .ico{font-size:34px;margin-bottom:4px}
.ways{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.way{border:1.5px solid var(--a2);border-radius:10px;padding:10px 8px;text-align:center;font-size:12.5px;background:var(--a3)}
.way b{display:block;color:var(--ad);font-size:13.5px;margin-bottom:3px}
.way .ico{font-size:30px;margin-bottom:4px}
.big25{display:flex;align-items:center;gap:14px;background:var(--a3);border:2px dashed var(--a);border-radius:14px;padding:10px 16px;margin:4px 0 12px}
.big25 .n{white-space:nowrap;font-size:40px;font-weight:800;color:var(--ad);line-height:1}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:8px 0}
.pill{border:2px solid var(--a);color:var(--ad);border-radius:22px;padding:6px 14px;font-weight:700;font-size:12.5px;background:var(--a3)}
.box{width:16px;height:16px;border:1.5px solid var(--a);border-radius:4px;display:inline-block}
/* shopping */
.shop{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--a);flex:1;max-height:215mm}
.shop>div{padding:10px 14px}.shop>div+div{border-right:2px solid var(--a2)}
.shop h4{margin:10px 0 4px;color:var(--a);font-size:14.5px;border-bottom:1.5px solid var(--a2);padding-bottom:3px}
.shop ul{margin:0;padding-right:16px;font-size:12.5px;font-weight:500}
/* cover */
.cover{background:var(--a);color:#fff;padding:0}
.cover .blob{position:absolute;width:150mm;height:150mm;border-radius:50%;background:color-mix(in srgb,var(--a) 82%,#fff);left:-40mm;bottom:-20mm}
.cover .blob2{position:absolute;width:90mm;height:90mm;border-radius:50%;background:color-mix(in srgb,var(--a) 88%,#000);right:-30mm;top:-25mm;opacity:.35}
.ch{position:relative;padding:20mm 16mm 0;text-align:center}
.ch .logo{font-family:'Aref Ruqaa',serif;font-size:64px;line-height:1}
.ch .tl{font-size:15px;letter-spacing:0;opacity:.95}
.ch h1{font-size:30px;margin:12px 0 2px;font-weight:800}
.photo{position:relative;width:96mm;height:96mm;border-radius:50%;overflow:hidden;margin:10mm auto 8mm;border:6px solid #fff;box-shadow:0 10px 30px #0003}
.photo img{width:100%;height:100%;object-fit:cover}
.cc{position:relative;margin:0 18mm;background:#fff;color:var(--ink);border-radius:16px;padding:12px 16px;box-shadow:0 8px 24px #0002}
.cc table{font-size:13px}.cc td{text-align:right}.cc td:first-child{color:var(--muted);width:42%}
.cover .foot .brand,.cover .foot .h{color:#fff}
.rules td{padding:14px 12px;font-size:13.5px}.pill{font-size:14px;padding:8px 16px}.tile{font-size:13px}.tiles{gap:16px 8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sign{line-height:2.4;font-size:13.5px}
@media screen{.edit .page [data-e]{outline:1px dashed #0002}}
@media (max-width:860px){.pages{zoom:.5}}
@page{size:A4;margin:0}
@media print{
 body{background:#fff}.panel{display:none}.pages{padding:0;gap:0;zoom:1}
 .page{box-shadow:none;break-after:page;margin:0}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .q{border-bottom:0}.q.m{background:none}
}
</style>
</head>

<div class="panel">
 <h2>بيانات الزبونة (تتغير الكميات تلقائيا)</h2>
 <div class="grid">
  <label>اسم الزبونة<input id="name" value="سارة"></label>
  <label>العمر (سنة)<input id="age" type="number" value="25"></label>
  <label>الطول (سم)<input id="h" type="number" value="158"></label>
  <label>الوزن الحالي (كجم)<input id="w" type="number" value="49"></label>
  <label>مستوى النشاط
   <select id="act"><option value="1.2">قليل جدا (مكتبي)</option><option value="1.375" selected>خفيف (رياضة 1 إلى 3 أيام)</option><option value="1.55">متوسط (3 إلى 5 أيام)</option><option value="1.725">عالي (6 إلى 7 أيام)</option></select></label>
  <label>الزيادة اليومية في السعرات
   <select id="sur"><option value="300">300 سعرة (زيادة هادئة)</option><option value="400" selected>400 سعرة</option><option value="500">500 سعرة (زيادة أسرع)</option></select></label>
  <label>سعرات يدوية (اختياري)<input id="man" type="number" placeholder="تلغي الحساب التلقائي"></label>
  <label>اسم الأخصائية<input id="dt" value=""></label>
  <label>تاريخ الخطة<input id="date" type="date"></label>
  <label>نص التذييل<input id="hd" value="مزيونة | خلطة الأنوثة"></label>
 </div>
 <div class="stats" id="stats"></div>
 <div class="warn" id="warn"></div>
 <div class="row">
  <span class="hint">لون التصميم:</span>
  <span class="sw" style="background:#c48bd9" data-c="#c48bd9"></span>
  <span class="sw" style="background:#d98ca3" data-c="#d98ca3"></span>
  <span class="sw" style="background:#b98a6e" data-c="#b98a6e"></span>
  <span class="sw" style="background:#7fa9a0" data-c="#7fa9a0"></span>
  <input type="color" id="col" value="#c48bd9" style="width:40px;height:32px;padding:0;border:0">
  <button class="btn" id="print">طباعة / حفظ PDF</button>
  <button class="btn ghost" id="reset">إعادة حساب كل الكميات</button>
  <button class="btn ghost" id="editBtn">تعديل النصوص: مغلق</button>
 </div>
 <div class="hint" style="margin-top:6px">أي رقم ملون في الخطة يمكن الضغط عليه وتغييره يدويا (يظهر بالأصفر). عند الحفظ اختاري "حفظ كملف PDF" وفعّلي "رسومات الخلفية".</div>
</div>

const fmt=(v,u)=>{
 if(u==="g")return v>=50?Math.round(v/10)*10:Math.max(5,Math.round(v/5)*5);
 if(u==="ml")return Math.max(50,Math.round(v/25)*25);
 if(u==="hf"){const r=Math.max(.5,Math.round(v*2)/2),i=Math.floor(r);return r%1?(i?i+"½":"½"):r}
 return Math.max(1,Math.round(v));
};
const fields=["name","age","h","w","act","sur","man","dt","date","hd"];
let f=1;
function calc(){
 const w=+$("w").value||0,h=+$("h").value||0,a=+$("age").value||0;
 const bmr=10*w+6.25*h-5*a-161,tdee=bmr*+$("act").value;
 const kcal=+$("man").value||Math.round((tdee+ +$("sur").value)/50)*50;
 f=Math.min(1.5,Math.max(.75,kcal/BASE));
 const bmi=h?w/((h/100)**2):0,lo=18.5*(h/100)**2,hi=24.9*(h/100)**2;
 const prot=Math.round(w*1.5/5)*5;
 const d=$("date").value?new Date($("date").value).toLocaleDateString("ar-OM-u-nu-latn"):"";
 const V={name:$("name").value,age:a,h,w,kcal,prot,dt:$("dt").value||"..............",date:d||"..............",bmi:bmi?bmi.toFixed(1)+(bmi<18.5?" (نقص وزن)":bmi<25?" (طبيعي)":" (فوق الطبيعي)"):""};
 document.querySelectorAll("[data-v]").forEach(e=>e.textContent=V[e.dataset.v]??"");
 document.querySelectorAll("[data-hd]").forEach(e=>e.textContent=$("hd").value);
 document.querySelectorAll(".q").forEach(e=>{if(!e.classList.contains("m"))e.textContent=fmt(+e.dataset.b*f,e.dataset.u)});
 $("stats").innerHTML=`<span class="stat">الحرق الأساسي <b>${Math.round(bmr)}</b></span><span class="stat">احتياج الثبات <b>${Math.round(tdee)}</b></span><span class="stat">الهدف <b>${kcal}</b> سعرة</span><span class="stat">البروتين <b>${prot}</b> غ</span><span class="stat">معامل الكميات <b>×${f.toFixed(2)}</b></span><span class="stat">الوزن الصحي لطولها <b>${lo.toFixed(0)} إلى ${hi.toFixed(0)}</b> كجم</span>`;
 const wr=$("warn");
 if(bmi>=25){wr.style.display="block";wr.textContent="تنبيه: مؤشر كتلة الجسم فوق الطبيعي. برنامج زيادة الوزن قد لا يناسب هذه الزبونة، راجعي الحالة قبل الإرسال."}
 else if(kcal/BASE>1.5||kcal/BASE<.75){wr.style.display="block";wr.textContent="تنبيه: السعرات المستهدفة خارج نطاق القالب، الكميات وصلت للحد الأعلى أو الأدنى. راجعيها يدويا."}
 else wr.style.display="none";
 try{const s={};fields.forEach(k=>s[k]=$(k).value);localStorage.setItem("mz_form",JSON.stringify(s))}catch(e){}
}
try{const s=JSON.parse(localStorage.getItem("mz_form")||"null");if(s)fields.forEach(k=>{if(s[k]!=null)$(k).value=s[k]});const c=localStorage.getItem("mz_col");if(c)setCol(c)}catch(e){}
if(!$("date").value)$("date").value=new Date().toISOString().slice(0,10);
function setCol(c){document.documentElement.style.setProperty("--a",c);$("col").value=c;try{localStorage.setItem("mz_col",c)}catch(e){}}
fields.forEach(k=>$(k).addEventListener("input",calc));
document.querySelectorAll(".sw").forEach(s=>s.addEventListener("click",()=>setCol(s.dataset.c)));
$("col").addEventListener("input",e=>setCol(e.target.value));
$("pages").addEventListener("input",e=>{const q=e.target.closest(".q");if(q)q.classList.add("m")});
$("reset").addEventListener("click",()=>{document.querySelectorAll(".q.m").forEach(q=>q.classList.remove("m"));calc()});
let ed=false;
$("editBtn").addEventListener("click",()=>{ed=!ed;document.querySelectorAll(".page").forEach(p=>p.contentEditable=ed);document.body.classList.toggle("edit",ed);$("editBtn").textContent="تعديل النصوص: "+(ed?"مفتوح":"مغلق")});
$("print").addEventListener("click",()=>{const t=document.title;document.title="برنامج مزيونة - "+$("name").value;try{window.print()}catch(e){}setTimeout(()=>document.title=t,800)});
calc();
}
</script>
